name: view-rig tests

on:
  push:
    paths:
      - 'code/view-rig/**'
      - '.github/workflows/view-rig.yml'
  pull_request:
    paths:
      - 'code/view-rig/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy pytest
      - name: Run the tests
        working-directory: code/view-rig
        run: pytest -q
